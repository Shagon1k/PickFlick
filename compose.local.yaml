services:
    redis:
        image: redis:8.2.2-alpine
        command: ['redis-server', '--save', '', '--appendonly', 'no']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 3s
            timeout: 3s
            retries: 20
        ports:
            - '127.0.0.1:${REDIS_PORT:-16379}:6379'

    postgres:
        image: postgres:17.6-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
        ports:
            - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 3s
            timeout: 3s
            retries: 20

    minio:
        image: cgr.dev/chainguard/minio@sha256:d7c906993247627c19f37fc1fa302c34cf2d209ae0e7dc7d52fb0be6ac2849ba
        command: ['server', '/data', '--console-address', ':9001']
        environment:
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
        ports:
            - '127.0.0.1:${MINIO_API_PORT:-19000}:9000'
            - '127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001'
        volumes:
            - minio-data:/data
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:9000/minio/health/live']
            interval: 3s
            timeout: 3s
            retries: 20

    minio-init:
        image: cgr.dev/chainguard/minio-client@sha256:f0dd93b48af1f8a641edcd3c64661c8dbe05189bd2ef2f8cea216eb18af10bf8
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
            STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
        entrypoint:
            - /bin/sh
            - -ec
            - |
                mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
                mc mb --ignore-existing "local/$${STORAGE_BUCKET}"
        restart: 'no'

volumes:
    minio-data:
    postgres-data:
