name: pickflick-${APP_ENV:?APP_ENV must be uat or production}

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION is required}

x-runtime-environment: &runtime-environment
  APP_ENV: ${APP_ENV:?APP_ENV is required}
  SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION is required}
  SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:?SHUTDOWN_TIMEOUT_MS is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:?S3_FORCE_PATH_STYLE is required}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  SMTP_SECURE: ${SMTP_SECURE:?SMTP_SECURE is required}
  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}

x-application-service: &application-service
  cap_drop:
    - ALL
  init: true
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 15s
  stop_signal: SIGTERM
  tmpfs:
    - /tmp

services:
  release:
    <<: *application-service
    profiles:
      - release
    build:
      <<: *build
      target: release
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      application:
        aliases:
          - pickflick-${APP_ENV:?APP_ENV is required}-release
    restart: "no"

  api:
    <<: *application-service
    profiles:
      - application
    build:
      <<: *build
      target: api
    environment:
      <<: *runtime-environment
      API_HOST: 0.0.0.0
      API_PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      application:
        aliases:
          - pickflick-${APP_ENV:?APP_ENV is required}-api

  worker:
    <<: *application-service
    profiles:
      - application
    build:
      <<: *build
      target: worker
    environment: *runtime-environment
    networks:
      application:
        aliases:
          - pickflick-${APP_ENV:?APP_ENV is required}-worker

  web:
    <<: *application-service
    profiles:
      - application
    build:
      <<: *build
      target: web
    environment:
      NODE_ENV: production
      SOURCE_REVISION: ${SOURCE_REVISION:?SOURCE_REVISION is required}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      application:
        aliases:
          - pickflick-${APP_ENV:?APP_ENV is required}-web
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache

networks:
  application:
    external: true
    name: ${DOKPLOY_NETWORK:?DOKPLOY_NETWORK is required}
