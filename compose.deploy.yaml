name: pickflick-${APP_ENV:?APP_ENV must be uat or production}

x-build: &build
    context: .
    dockerfile: Dockerfile
    args:
        SOURCE_REVISION: ${SOURCE_REVISION:-}

x-runtime-environment: &runtime-environment
    APP_ENV: ${APP_ENV:?APP_ENV is required}
    REDIS_URL: redis://pickflick-${APP_ENV:?APP_ENV is required}-redis:6379
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required}
    STORAGE_REGION: ${STORAGE_REGION:?STORAGE_REGION is required}
    STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET is required}
    STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
    STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
    STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:?STORAGE_FORCE_PATH_STYLE is required}
    RESEND_DELIVERY_MODE: live
    RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
    RESEND_FROM: ${RESEND_FROM:?RESEND_FROM is required}
    RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:?RESEND_WEBHOOK_SECRET is required}
    CONTACT_DELIVERY_TO: ${CONTACT_DELIVERY_TO:?CONTACT_DELIVERY_TO is required}
    CATALOG_ENABLED: ${CATALOG_ENABLED:-false}
    CATALOG_TIMEOUT_MS: ${CATALOG_TIMEOUT_MS:-5000}
    CATALOG_PROVIDER: ${CATALOG_PROVIDER:-poiskkino-thetvdb}
    CATALOG_LOCALE: ${CATALOG_LOCALE:-en-US}
    POISKKINO_API_KEY: '${POISKKINO_API_KEY:-}'
    THETVDB_READ_TOKEN: '${THETVDB_READ_TOKEN:-}'
    TMDB_READ_TOKEN: '${TMDB_READ_TOKEN:-}'
    CATALOG_REFRESH_HOURS: ${CATALOG_REFRESH_HOURS:-24}
    CATALOG_STALE_HOURS: ${CATALOG_STALE_HOURS:-168}

x-application-service: &application-service
    cap_drop:
        - ALL
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
        - no-new-privileges:true
    stop_grace_period: 15s
    stop_signal: SIGTERM
    tmpfs:
        - /tmp

services:
    redis:
        image: redis:8.2.2-alpine
        command: ['redis-server', '--save', '', '--appendonly', 'no']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 3s
            timeout: 3s
            retries: 20
        restart: unless-stopped
        networks:
            notification-signals:
                aliases:
                    - pickflick-${APP_ENV:?APP_ENV is required}-redis

    release:
        <<: *application-service
        build:
            <<: *build
            target: release
        environment:
            APP_ENV: ${APP_ENV:?APP_ENV is required}
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
        networks:
            application:
                aliases:
                    - pickflick-${APP_ENV:?APP_ENV is required}-release
        restart: 'no'

    backend:
        <<: *application-service
        build:
            <<: *build
            target: backend
        environment:
            <<: *runtime-environment
            BACKEND_HOST: 0.0.0.0
            BACKEND_PORT: 3001
            AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL is required}
            AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
            APPLE_SIGN_IN_ENABLED: ${APPLE_SIGN_IN_ENABLED:-false}
            APPLE_CLIENT_ID: '${APPLE_CLIENT_ID:-}'
            APPLE_KEY_ID: '${APPLE_KEY_ID:-}'
            APPLE_PRIVATE_KEY: '${APPLE_PRIVATE_KEY:-}'
            APPLE_TEAM_ID: '${APPLE_TEAM_ID:-}'
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
        depends_on:
            release:
                condition: service_completed_successfully
                required: true
        expose:
            - '3001'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            application:
                aliases:
                    - pickflick-${APP_ENV:?APP_ENV is required}-backend
            notification-signals:

    worker:
        <<: *application-service
        build:
            <<: *build
            target: worker
        environment:
            APP_ENV: ${APP_ENV:?APP_ENV is required}
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
            REDIS_URL: redis://pickflick-${APP_ENV:?APP_ENV is required}-redis:6379
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "if(Date.now()-Number(require('node:fs').readFileSync('/tmp/pickflick-deadline-worker','utf8'))>30000)process.exit(1)",
                ]
            interval: 5s
            timeout: 3s
            retries: 6
            start_period: 15s
        depends_on:
            release:
                condition: service_completed_successfully
        networks:
            application:
                aliases:
                    - pickflick-${APP_ENV:?APP_ENV is required}-worker
            notification-signals:

    email-worker:
        <<: *application-service
        build:
            <<: *build
            target: worker
        command: ['node', 'dist/email-worker.js']
        stop_grace_period: 45s
        environment:
            APP_ENV: ${APP_ENV:?APP_ENV is required}
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
            AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL is required}
            RESEND_DELIVERY_MODE: live
            RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
            RESEND_FROM: ${RESEND_FROM:?RESEND_FROM is required}
            CONTACT_DELIVERY_TO: ${CONTACT_DELIVERY_TO:?CONTACT_DELIVERY_TO is required}
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "if(Date.now()-Number(require('node:fs').readFileSync('/tmp/pickflick-email-worker','utf8'))>60000)process.exit(1)",
                ]
            interval: 10s
            timeout: 3s
            retries: 6
            start_period: 15s
        depends_on:
            backend:
                condition: service_healthy
            release:
                condition: service_completed_successfully
        networks:
            application:
                aliases:
                    - pickflick-${APP_ENV:?APP_ENV is required}-email-worker

    frontend:
        <<: *application-service
        build:
            <<: *build
            target: frontend
            args:
                BACKEND_INTERNAL_URL: http://pickflick-${APP_ENV:?APP_ENV is required}-backend:3001
                SOURCE_REVISION: ${SOURCE_REVISION:-}
        environment:
            APP_ENV: ${APP_ENV:?APP_ENV is required}
            APPLE_SIGN_IN_ENABLED: ${APPLE_SIGN_IN_ENABLED:-false}
            BACKEND_INTERNAL_URL: http://pickflick-${APP_ENV:?APP_ENV is required}-backend:3001
            NODE_ENV: production
        depends_on:
            backend:
                condition: service_healthy
        expose:
            - '3000'
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            application:
                aliases:
                    - pickflick-${APP_ENV:?APP_ENV is required}-frontend
        tmpfs:
            - /tmp
            - /app/apps/frontend/.next/cache

networks:
    notification-signals:
        internal: true
    application:
        external: true
        name: dokploy-network
