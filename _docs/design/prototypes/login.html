<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — PickFlick</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --surface-lit: #1e1e1e;
      --fg: #eee9e5;
      --fg-secondary: #a6a19c;
      --muted: #7d7a76;
      --border: #2d2a27;
      --border-lit: #403c38;
      --accent: #eee9e5;
      --accent-dim: #706a64;
      --accent-on: #0c0c0c;
      --accent-glow: rgba(238, 233, 229, 0.08);
      --accent-soft: rgba(238, 233, 229, 0.06);
      --gold: #C89B55;
      --gold-light: #E0B87A;
      --gold-dark: #8A6330;
      --gold-soft: rgba(200, 155, 85, 0.14);
      --gold-glow: rgba(200, 155, 85, 0.18);
      --gold-border: rgba(200, 155, 85, 0.34);
      --ivory: #E8D8B8;
      --ivory-soft: rgba(232, 216, 184, 0.10);
      --ivory-muted: rgba(232, 216, 184, 0.68);
      --warm-accent: var(--gold);
      --warm-accent-soft: var(--gold-soft);
      --warm-accent-line: var(--gold-border);
      --danger: #A94E4A;
      --danger-hover: #B65A55;
      --danger-border: rgba(169, 78, 74, 0.38);
      --danger-soft: rgba(169, 78, 74, 0.12);
      --danger-text: #D9A09B;
      --success: #6F8A63;
      --success-soft: rgba(111, 138, 99, 0.13);
      --success-border: rgba(111, 138, 99, 0.34);
      --warn: #B9823A;
      --warn-soft: rgba(185, 130, 58, 0.14);
      --warn-border: rgba(185, 130, 58, 0.34);
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      --fs-hero: clamp(44px, 6vw, 76px);
      --fs-section: clamp(32px, 4vw, 48px);
      --fs-app-title: clamp(32px, 9vw, 48px);
      --fs-app-section: 24px;
      --fs-card-title: 20px;
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-body-sm: 14px;
      --fs-meta: 13px;
      --fs-caption: 12px;
      --fs-micro: 11px;
      --fs-nav: 12px;
      --lh-tight: 1.05;
      --lh-title: 1.12;
      --lh-body: 1.55;
      --lh-ui: 1.3;
      --lh-caption: 1.2;
      --tracking-tight: -0.02em;
      --tracking-normal: 0;
      --tracking-wide: 0.06em;
      --tracking-caps: 0.12em;
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --gap-2xl: 96px;
      --radius: 12px;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --button-primary-hover: #ddd7d1;
      --hit: 44px;
      --container: 1120px;
      --gutter: 32px;
      --focus: rgba(232,216,184,.72);
      --focus-ring: 0 0 0 3px rgba(232,216,184,.18);
    }

    :focus-visible {
      outline: 1px solid var(--focus);
      box-shadow: var(--focus-ring);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; height: 100%; }
    body {
      margin: 0; min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2 { text-wrap: balance; }

    .film-grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 100;
      opacity: 0.025; background: repeating-radial-gradient(circle at 17% 32%, var(--fg), var(--bg) 0.15%);
    }

    .back-link {
      position: fixed; top: 24px; left: 24px; z-index: 10;
      display: inline-flex; align-items: center; gap: 6px;
      font-size: var(--fs-body-sm); color: var(--muted); transition: color 0.15s;
    }
    .back-link svg { width: 16px; height: 16px; }
    .back-link:hover { color: var(--fg); }

    .login-scene {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 96px 24px 48px;
      max-width: 440px; width: 100%;
    }

    .spotlight {
      position: absolute; top: -20%; left: 50%; translate: -50% 0;
      width: 500px; height: 500px; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, var(--accent-glow) 0%, transparent 70%);
    }

    .login-mascot { width: 200px; margin-top: 25px; margin-bottom: -40px; position: relative; z-index: 0; }
    .login-mascot img { width: 100%; height: auto; }

    .login-card {
      position: relative; z-index: 1;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 40px 36px;
      width: 100%; box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      margin-top: 5px;
    }

    .login-card h1 {
      font-family: var(--font-display); font-size: var(--fs-app-section); line-height: var(--lh-title);
      letter-spacing: var(--tracking-tight); margin: 0 0 8px;
    }
    .login-card .lead { font-size: var(--fs-body); color: var(--fg-secondary); margin-bottom: var(--gap-lg); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; min-height: var(--hit); padding: 11px 20px;
      border: 1px solid transparent; border-radius: var(--radius);
      font-family: var(--font-body); font-size: var(--fs-body); font-weight: 500;
      line-height: var(--lh-ui); letter-spacing: var(--tracking-tight);
      transition: transform .05s ease, color .15s ease,
                  background-color .15s ease, border-color .15s ease;
    }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .btn:active { transform: translateY(1px); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--fg); }

    .oauth-btn {
      position: relative;
      width: 100%; padding-block: 14px;
    }
    .oauth-icon {
      position: absolute; left: 24px; top: 50%; translate: 0 -50%;
      width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    }
    .oauth-icon svg { width: 22px; height: 22px; }
    .apple .oauth-icon svg { width: 28px; height: 28px; }

    .oauth-stack { display: flex; flex-direction: column; gap: var(--gap-sm); }

    .legal {
      font-size: var(--fs-caption); color: var(--muted); line-height: var(--lh-body);
      margin-top: var(--gap-md);
    }
    .legal a { text-decoration: underline; text-underline-offset: 2px; }
    .legal a:hover { color: var(--fg); }

    .sprocket-divider {
      display: flex; align-items: center; gap: var(--gap-sm); margin-top: var(--gap-xl);
    }
    .sprocket-divider::before, .sprocket-divider::after {
      content: ''; height: 1px; flex: 1; min-width: 32px;
      background: repeating-linear-gradient(90deg, var(--border) 0px, var(--border) 3px, transparent 3px, transparent 10px);
    }
    .sprocket-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border); flex-shrink: 0; }

    .scene-ornament {
      margin-top: var(--gap-lg); text-align: center;
      font-family: var(--font-mono); font-size: var(--fs-micro); letter-spacing: var(--tracking-caps);
      text-transform: uppercase; color: var(--accent-dim);
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
      .login-mascot { width: 140px; }
      .back-link { top: 16px; left: 16px; }
    }

    /* Shared standalone-flow alignment */
    html { background: #090909; }
    body {
      position: relative;
      min-height: 100svh;
      background: #090909;
      isolation: isolate;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 8%, color-mix(in srgb, var(--gold-soft) 32%, transparent), transparent 34rem),
        linear-gradient(180deg, var(--bg), #090909);
    }
    .back-link {
      top: 20px; left: 20px;
      min-height: var(--hit); padding: 0 10px 0 8px;
      border-radius: var(--radius);
      color: var(--fg-secondary);
      font-weight: 500;
      transition: color .15s ease, background-color .15s ease;
    }
    .back-link svg { width: 18px; height: 18px; }
    .back-link:hover { color: var(--fg); background: var(--accent-soft); }
    .login-card { box-shadow: 0 20px 52px rgba(0,0,0,.28); }
    @media (max-width: 480px) {
      .back-link { top: 12px; left: 8px; }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </a>

  <div class="film-grain" aria-hidden="true"></div>

  <div class="login-scene" data-od-id="login-scene">
    <div class="spotlight" aria-hidden="true"></div>

    <div class="login-mascot">
      <img src="mqvezhgb-panda-zoom.webp" alt="PickFlick panda detective mascot" />
    </div>

    <div class="login-card">
      <h1>Welcome to PickFlick</h1>
      <p class="lead">Sign in to join your group's screening room.</p>

      <div class="oauth-stack">
        <button class="btn btn-secondary oauth-btn">
          <span class="oauth-icon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32l3.57 2.76A12 12 0 0022.56 12.25z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.76A6.95 6.95 0 0112 19.14c-3.15 0-5.82-2.13-6.77-5l-3.7 2.86A11.04 11.04 0 0012 23z"/><path fill="currentColor" d="M5.23 14.14a7.12 7.12 0 010-4.28l-3.7-2.86A11.04 11.04 0 001 12c0 1.78.42 3.46 1.22 4.99l3.7-2.86z"/><path fill="currentColor" d="M12 4.86c1.6 0 3.04.55 4.17 1.63l3.12-3.12A11.04 11.04 0 0012 1C8.1 1 4.68 2.83 2.53 5.7l3.7 2.86A7.13 7.13 0 0112 4.86z"/></svg></span>
          Continue with Google
        </button>
        <button class="btn btn-secondary oauth-btn apple">
          <span class="oauth-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg></span>
          Continue with Apple
        </button>
      </div>

      <p class="legal">By continuing, you agree to PickFlick's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
    </div>

    <div class="sprocket-divider" aria-hidden="true">
      <span class="sprocket-dot"></span>
      <span class="sprocket-dot"></span>
      <span class="sprocket-dot"></span>
    </div>

    <p class="scene-ornament">Scene 01 · The Arrival</p>
  </div>

</body>
</html>
