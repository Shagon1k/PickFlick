<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Session — PickFlick</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --surface: #161616;
      --surface-lit: #1e1e1e;
      --fg: #eee9e5;
      --fg-secondary: #a6a19c;
      --muted: #7d7a76;
      --border: #2d2a27;
      --border-lit: #403c38;
      --accent: #eee9e5;
      --accent-dim: #706a64;
      --accent-glow: rgba(238,233,229,.08);
      --accent-soft: rgba(238,233,229,.06);
      --accent-on: #1a1a1a;
      --gold: #C89B55;
      --gold-light: #E0B87A;
      --gold-dark: #8A6330;
      --gold-soft: rgba(200,155,85,.14);
      --gold-glow: rgba(200,155,85,.18);
      --gold-border: rgba(200,155,85,.34);
      --ivory: #E8D8B8;
      --ivory-soft: rgba(232,216,184,.10);
      --ivory-muted: rgba(232,216,184,.68);
      --warm-accent: #C89B55;
      --warm-accent-soft: rgba(200,155,85,.14);
      --warm-accent-line: rgba(200,155,85,.32);
      --danger: #A94E4A;
      --danger-hover: #B65A55;
      --danger-border: rgba(169,78,74,.38);
      --danger-soft: rgba(169,78,74,.12);
      --danger-text: #D9A09B;
      --success: #6F8A63;
      --success-soft: rgba(111,138,99,.13);
      --success-border: rgba(111,138,99,.34);
      --warn: #B9823A;
      --warn-soft: rgba(185,130,58,.14);
      --warn-border: rgba(185,130,58,.34);
      --focus: rgba(232,216,184,.72);
      --focus-ring: 0 0 0 3px rgba(232,216,184,.18);
      --button-primary-hover: #ddd7d1;
      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
      --font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      --fs-hero: clamp(44px, 6vw, 76px);
      --fs-section: clamp(32px, 4vw, 48px);
      --fs-app-title: clamp(32px, 9vw, 48px);
      --fs-app-section: 24px;
      --fs-card-title: 20px;
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-body-sm: 14px;
      --fs-meta: 13px;
      --fs-caption: 12px;
      --fs-micro: 11px;
      --fs-nav: 12px;
      --lh-tight: 1.05;
      --lh-title: 1.12;
      --lh-body: 1.55;
      --lh-ui: 1.3;
      --lh-caption: 1.2;
      --tracking-tight: -0.025em;
      --tracking-normal: 0;
      --tracking-wide: 0.06em;
      --tracking-caps: 0.12em;
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --gap-2xl: 96px;
      --radius: 12px;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --container: 1120px;
      --gutter: 32px;
    }

    :focus-visible {
      outline: 1px solid var(--focus);
      box-shadow: var(--focus-ring);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; height: 100%; }
    body {
      margin: 0; min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2 { text-wrap: balance; }

    .film-grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 100;
      opacity: 0.025; background: repeating-radial-gradient(circle at 17% 32%, var(--fg), var(--bg) 0.15%);
    }

    .back-link {
      position: fixed; top: 24px; left: 24px; z-index: 10;
      display: inline-flex; align-items: center; gap: 6px;
      font-size: var(--fs-body-sm); color: var(--muted); transition: color 0.15s;
    }
    .back-link svg { width: 16px; height: 16px; }
    .back-link:hover { color: var(--fg); }

    .create-scene {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 96px 24px 48px;
      max-width: 480px; width: 100%;
    }

    .spotlight {
      position: absolute; top: -20%; left: 50%; translate: -50% 0;
      width: 500px; height: 500px; z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, var(--accent-glow) 0%, transparent 70%);
    }

    .create-mascot { width: 240px; margin-top: 25px; margin-bottom: -80px; position: relative; z-index: 0; transform: translateY(-55px); }
    .create-mascot img { width: 100%; height: auto; }

    .create-card {
      position: relative; z-index: 1;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 40px 36px;
      width: 100%; box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      margin-top: 5px; text-align: left;
    }

    .create-card h1 {
      font-family: var(--font-display); font-size: var(--fs-app-section); line-height: var(--lh-caption);
      letter-spacing: var(--tracking-tight); margin: 0 0 8px; text-align: center;
    }
    .create-card .lead { font-size: var(--fs-body); margin-bottom: var(--gap-lg); text-align: center; color: var(--fg-secondary); }

    .field-group { margin-bottom: var(--gap-md); }
    .field-group label {
      display: block; font-size: var(--fs-body-sm); font-weight: 500; color: var(--fg);
      margin-bottom: 6px;
    }
    .field-group label .hint { font-weight: 400; color: var(--muted); font-size: var(--fs-caption); }
    .field-group input[type="text"],
    .field-group input[type="date"],
    .field-group input[type="time"],
    .field-group textarea {
      width: 100%; padding: 12px 14px;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: var(--fs-body); font-family: var(--font-body);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field-group input[type="text"]:focus,
    .field-group input[type="date"]:focus,
    .field-group input[type="time"]:focus,
    .field-group textarea:focus {
      outline: none; border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .field-group input[type="date"]::-webkit-calendar-picker-indicator,
    .field-group input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8); cursor: pointer;
    }
    .time-wrap { display: flex; align-items: center; gap: 8px; }
    .time-wrap input { flex: 1; }
    .time-hint { font-size: var(--fs-meta); color: var(--muted); white-space: nowrap; }
    .field-group textarea { resize: vertical; min-height: 80px; }

    .mode-toggle {
      display: flex; gap: 0;
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      background: var(--bg); overflow: hidden; padding: 3px;
    }
    .mode-option {
      flex: 1; padding: 8px 14px; border: none; background: transparent;
      color: var(--fg-secondary); font-size: var(--fs-body-sm); font-weight: 550;
      cursor: pointer; border-radius: var(--radius-pill); transition: all .2s;
      white-space: nowrap; text-align: center;
    }
    .mode-option.active {
      background: transparent; color: var(--fg); font-weight: 700;
      box-shadow: inset 0 0 0 1px var(--border-lit);
    }
    .mode-option:not(.active):hover { color: var(--fg); }

    .mode-fields-reveal { animation: mode-fields-reveal .2s cubic-bezier(.22,.8,.3,1); }
    @keyframes mode-fields-reveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .movie-search-wrap { margin-top: var(--gap-md); }
    .movie-search-wrap .search-box {
      position: relative; width: 100%;
    }
    .movie-search-wrap .search-box input {
      width: 100%; padding: 12px 14px 12px 38px;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: var(--fs-body); font-family: var(--font-body);
      transition: border-color .2s, box-shadow .2s;
    }
    .movie-search-wrap .search-box input:focus {
      outline: none; border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }
    .movie-search-wrap .search-box .search-icon {
      position: absolute; left: 12px; top: 50%; translate: 0 -50%;
      width: 16px; height: 16px; color: var(--muted); pointer-events: none;
    }
    .movie-search-results {
      margin-top: 8px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); max-height: 240px; overflow-y: auto;
      display: none;
    }
    .movie-search-results.show { display: block; }
    .movie-search-result {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      cursor: pointer; transition: background .15s;
      border-bottom: 1px solid var(--border);
    }
    .movie-search-result:last-child { border-bottom: 0; }
    .movie-search-result:hover { background: var(--accent-soft); }
    .movie-search-result.selected { background: var(--accent-glow); }
    .movie-search-result .sr-poster {
      width: 40px; height: 56px; border-radius: 4px;
      background: var(--surface-lit); flex-shrink: 0;
      display: grid; place-items: center; color: var(--accent-dim);
      font-size: 10px; overflow: hidden;
    }
    .movie-search-result .sr-poster img { width: 100%; height: 100%; object-fit: cover; }
    .movie-search-result .sr-info { min-width: 0; }
    .movie-search-result .sr-title { font-size: var(--fs-body-sm); font-weight: 600; color: var(--fg); }
    .movie-search-result .sr-meta { font-size: var(--fs-caption); color: var(--muted); margin-top: 2px; }
    .selected-movie-card {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border: 1px solid var(--border-lit); border-radius: var(--radius);
      background: var(--accent-soft); margin-top: 4px;
    }
    .selected-movie-card .sm-poster {
      width: 44px; height: 62px; border-radius: 4px;
      background: var(--surface-lit); flex-shrink: 0; overflow: hidden;
    }
    .selected-movie-card .sm-poster img { width: 100%; height: 100%; object-fit: cover; }
    .selected-movie-card .sm-info { min-width: 0; }
    .selected-movie-card .sm-title { font-size: var(--fs-body-sm); font-weight: 600; color: var(--fg); }
    .selected-movie-card .sm-meta { font-size: var(--fs-caption); color: var(--muted); margin-top: 2px; }
    .selected-movie-card .sm-remove {
      flex-shrink: 0; width: 28px; height: 28px; border: 1px solid var(--border);
      border-radius: 50%; background: transparent; color: var(--muted);
      display: grid; place-items: center; cursor: pointer; font-size: 14px;
      transition: all .15s;
    }
    .selected-movie-card .sm-remove:hover { color: var(--danger); border-color: var(--danger-border); }

    .divider { height: 1px; background: var(--border); margin: var(--gap-md) 0; }

    .submit-zone {
      height: 48px; margin-top: var(--gap-sm);
    }

    .create-btn {
      width: 100%; height: 48px; display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: var(--radius);
      font-size: var(--fs-body); font-weight: 600;
      letter-spacing: var(--tracking-tight);
      transition: background 0.2s, box-shadow 0.2s, transform 0.05s;
    }
    .create-btn:hover { background: var(--button-primary-hover); box-shadow: 0 0 0 1px var(--accent-dim); }
    .create-btn:active { transform: translateY(1px); }

    .invite-area {
      display: none; align-items: center; gap: var(--gap-sm); height: 48px;
    }
    .invite-area.show { display: flex; }
    .invite-area input {
      flex: 1; min-width: 0;
      padding: 12px 14px; height: 48px;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: var(--fs-body-sm); font-family: var(--font-mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .copy-btn {
      flex-shrink: 0; height: 48px; padding: 0 18px;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: var(--radius);
      font-size: var(--fs-body-sm); font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: var(--button-primary-hover); }
    .copy-btn.copied { background: var(--success); color: var(--fg); }

    .sprocket-divider {
      display: flex; align-items: center; gap: var(--gap-sm); margin-top: var(--gap-xl);
    }
    .sprocket-divider::before, .sprocket-divider::after {
      content: ''; height: 1px; flex: 1; min-width: 32px;
      background: repeating-linear-gradient(90deg, var(--border) 0px, var(--border) 3px, transparent 3px, transparent 10px);
    }
    .sprocket-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border); flex-shrink: 0; }

    .scene-ornament {
      margin-top: var(--gap-lg); text-align: center;
      font-family: var(--font-mono); font-size: var(--fs-micro); letter-spacing: var(--tracking-caps);
      text-transform: uppercase; color: var(--accent-dim);
    }

    @media (max-width: 480px) {
      .create-card { padding: 32px 24px; }
      .create-mascot { width: 140px; }
      .back-link { top: 16px; left: 16px; }
    }

    .mobile-bottom-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: color-mix(in oklch, var(--bg) 96%, transparent);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-lit);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .mobile-bottom-bar nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      max-width: 480px; margin-inline: auto;
    }

    .nav-group {
      position: relative; min-width: 0;
    }

    .nav-trigger {
      position: relative;
      width: 100%; min-height: 63px;
      padding: 0; border: 0; background: transparent;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px;
      color: var(--accent-dim); cursor: pointer;
      transition: color .18s ease;
      font-size: var(--fs-micro); font-weight: 500; letter-spacing: var(--tracking-wide);
      line-height: var(--lh-tight);
    }

    .nav-trigger:hover,
    .nav-group.is-open .nav-trigger,
    .nav-group.active .nav-trigger { color: var(--fg); }

    .nav-trigger svg { display: block; width: 22px; height: 22px; stroke-width: 1.5; }

    .mini-icon { width: 20px; height: 20px; stroke-width: 1.8; flex-shrink: 0; }

    .nav-trigger .bar-badge {
      position: absolute; top: 6px; right: calc(50% - 18px);
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    }

    .film-menu {
      position: absolute; left: 50%; bottom: calc(100% - 1px);
      width: 174px;
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateX(-50%) translateY(14px) scaleY(.18);
      transform-origin: bottom center;
      transition: opacity .18s ease, visibility 0s linear .34s, transform .34s cubic-bezier(.22,.8,.3,1);
    }

    .nav-group.is-open .film-menu {
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translateX(-50%) translateY(0) scaleY(1);
      transition: opacity .18s ease, visibility 0s linear 0s, transform .34s cubic-bezier(.22,.8,.3,1);
    }

    .film-strip {
      position: relative;
      padding: 10px 22px;
      border: 1px solid var(--border-lit);
      border-radius: 7px 7px 3px 3px;
      background: linear-gradient(var(--surface-lit), var(--bg));
      box-shadow: 0 -12px 28px rgba(0,0,0,.45);
    }

    .film-strip::before,
    .film-strip::after {
      content: "";
      position: absolute; top: 8px; bottom: 8px;
      width: 9px; border-radius: 2px; opacity: .68;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 7px,
        var(--accent-dim) 7px 14px,
        transparent 14px 22px
      );
    }

    .film-strip::before { left: 6px; }
    .film-strip::after { right: 6px; }

    .film-frame {
      min-height: 48px;
      padding: 12px 0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px;
      color: var(--muted); text-decoration: none; text-align: center;
      cursor: pointer;
      border: none; background: none;
      width: 100%;
      font: inherit;
      border-bottom: 1px solid var(--border);
      transition: color .16s ease, background-color .16s ease;
    }

    .film-frame:last-child { border-bottom: 0; }

    .film-frame:hover,
    .film-frame:focus-visible {
      color: var(--fg);
      background: var(--accent-soft);
      outline: none;
    }

    .film-frame b {
      max-width: 110px;
      font-size: var(--fs-caption); font-weight: 600; line-height: var(--lh-caption);
    }

    .film-frame.active { color: var(--accent); font-weight: 600; }

    .film-tail {
      width: 42px; height: 10px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-top: 0;
      border-radius: 0 0 10px 10px;
      background: var(--bg);
    }

    .mobile-bar-btn {
      position: relative;
      width: 100%; min-height: 63px;
      padding: 0; border: 0; background: transparent;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px;
      color: var(--accent-dim); cursor: pointer;
      transition: color .18s ease;
      font-size: var(--fs-micro); font-weight: 500; letter-spacing: var(--tracking-wide);
      line-height: var(--lh-tight);
    }
    .mobile-bar-btn:hover { color: var(--fg); }
    .mobile-bar-btn svg { display: block; width: 22px; height: 22px; stroke-width: 1.5; }
    .mobile-bar-btn.active { color: var(--accent); }

    .mobile-notif-popover {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border-lit); border-radius: var(--radius);
      width: 280px; max-width: calc(100vw - 32px); display: none; z-index: 300;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4); overflow: hidden;
    }
    .mobile-notif-popover.show { display: block; }
    .notif-popover-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .notif-popover-header h4 { margin: 0; font-size: var(--fs-body-sm); }
    .notif-popover-header button { background: none; border: none; color: var(--accent-dim); font-size: var(--fs-caption); cursor: pointer; }
    .notif-list { max-height: 340px; overflow-y: auto; }
    .notif-item { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; }
    .notif-item + .notif-item { border-top: 1px solid var(--border); }
    .notif-item.unread { background: var(--accent-glow); }
    .notif-body { flex: 1; min-width: 0; }
    .notif-body p { margin: 0; font-size: var(--fs-meta); line-height: var(--lh-ui); color: var(--fg); }
    .notif-body .notif-meta { font-size: var(--fs-micro); color: var(--muted); margin-top: 4px; }
    .notif-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--surface-lit); display: grid; place-items: center; flex-shrink: 0; }
    .notif-icon svg { width: 14px; height: 14px; }

    @media (max-width: 820px) {
      .mobile-bottom-bar { display: block; }
      body { padding-bottom: 65px; }
    }
    @media (min-width: 821px) {
      .mobile-bottom-bar { display: none; }
    }

    /* Shared standalone-flow alignment */
    html { background: #090909; }
    body {
      position: relative;
      min-height: 100svh;
      padding-bottom: 0;
      background: #090909;
      isolation: isolate;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 8%, color-mix(in srgb, var(--gold-soft) 32%, transparent), transparent 34rem),
        linear-gradient(180deg, var(--bg), #090909);
    }
    .back-link {
      top: 20px; left: 20px;
      min-height: var(--hit); padding: 0 10px 0 8px;
      border-radius: var(--radius);
      color: var(--fg-secondary);
      font-weight: 500;
      transition: color .15s ease, background-color .15s ease;
    }
    .back-link svg { width: 18px; height: 18px; }
    .back-link:hover { color: var(--fg); background: var(--accent-soft); }
    .create-card { box-shadow: 0 20px 52px rgba(0,0,0,.28); }
    .field-group input[type="text"]:focus,
    .field-group input[type="date"]:focus,
    .field-group input[type="time"]:focus,
    .field-group textarea:focus,
    .movie-search-wrap .search-box input:focus {
      border-color: var(--gold-border);
      box-shadow: 0 0 0 3px var(--gold-soft);
    }
    .movie-search-result.selected,
    .selected-movie-card {
      background: var(--gold-soft);
      border-color: var(--gold-border);
    }
    .mobile-bottom-bar,
    .mobile-notif-popover { display: none !important; }

    @media (max-width: 480px) {
      .back-link { top: 12px; left: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mode-fields-reveal { animation: none; }
    }
  </style>
</head>
<body>

  <a href="app.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

    const notifData = [

    ];
    const notifIcons = {
      vote: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',

      rate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
      session: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/></svg>',
      member: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>',
    };
    function renderNotifs() {
      const unreadCount = notifData.filter(n => n.unread).length;
      const mobileBadge = document.getElementById('mobileBellBadge');
      if (mobileBadge) mobileBadge.style.display = unreadCount > 0 ? '' : 'none';
      const list = document.getElementById('mobileNotifList');
      if (!list) return;
      list.innerHTML = notifData.map(n => `
        <div class="notif-item ${n.unread ? 'unread' : ''}">
          <div class="notif-icon">${notifIcons[n.icon]}</div>
          <div class="notif-body"><p>${n.text}</p><div class="notif-meta">${n.time}</div></div>
        </div>
      `).join('');
    }
    function markAllRead() { notifData.forEach(n => n.unread = false); renderNotifs(); }
    function toggleNavGroup(groupId) {
      const group = document.getElementById(groupId);
      if (!group) return;
      const isOpen = group.classList.contains('is-open');
      closeAllNavGroups();
      if (!isOpen) group.classList.add('is-open');
    }
    function closeNavGroup(groupId) {
      const group = document.getElementById(groupId);
      if (group) group.classList.remove('is-open');
    }
    function closeAllNavGroups() {
      document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('is-open'));
    }
    function toggleMobileNotif() { const pop = document.getElementById('mobileNotifPopover'); if (pop) pop.classList.toggle('show'); }
    function setActiveFooterBtn(btnId) { document.querySelectorAll('.mobile-bar-btn, .nav-group').forEach(b => b.classList.remove('active')); const btn = document.getElementById(btnId); if (btn) btn.classList.add('active'); }
    function selectSettingsFromFilm(label) {
      const el = document.getElementById('mobileSettingsLabel');
      if (el) el.textContent = label;
      setActiveFooterBtn('settingsNavGroup');
      closeNavGroup('settingsNavGroup');
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-group')) closeAllNavGroups();
      const mPop = document.getElementById('mobileNotifPopover'), mBtn = document.getElementById('mobileAlertsBtn');
      if (mPop && !mPop.contains(e.target) && e.target !== mBtn && !mBtn.contains(e.target)) mPop.classList.remove('show');
      if (!e.target.closest('.movie-search-wrap')) {
        document.getElementById('movieSearchResults').classList.remove('show');
      }
    });
    document.getElementById('movieSearch').addEventListener('focus', function() {
      this.style.borderColor = '';
    });
    renderNotifs();
    document.addEventListener('DOMContentLoaded', () => renderNotifs());

    let selectedMovie = null;
    let sessionMode = 'normal';

    const filmDB = [
      { title: 'Oppenheimer', year: 2023, director: 'Christopher Nolan', genre: 'History, Drama', poster: 'mr2fxjca-image.png' },
      { title: 'Parasite', year: 2019, director: 'Bong Joon-ho', genre: 'Thriller, Drama', poster: 'mr2fblyy-image.png' },
      { title: 'The Grand Budapest Hotel', year: 2014, director: 'Wes Anderson', genre: 'Comedy, Drama', poster: 'mr2fawb8-image.png' },
      { title: 'Blade Runner 2049', year: 2017, director: 'Denis Villeneuve', genre: 'Sci-Fi, Thriller', poster: 'mr2flyvp-image.png' },
      { title: 'Everything Everywhere All at Once', year: 2022, director: 'Daniels', genre: 'Action, Sci-Fi', poster: 'mr2g6jf0-image.png' },
      { title: 'Dune: Part Two', year: 2024, director: 'Denis Villeneuve', genre: 'Sci-Fi', poster: 'mr4st1pk-image.png' },
      { title: 'Furiosa: A Mad Max Saga', year: 2024, director: 'George Miller', genre: 'Action, Sci-Fi', poster: 'mr3h52wb-image.png' },
      { title: 'Interstellar', year: 2014, director: 'Christopher Nolan', genre: 'Sci-Fi, Drama', poster: 'mr2fblyy-image.png' },
      { title: 'Mad Max: Fury Road', year: 2015, director: 'George Miller', genre: 'Action, Sci-Fi', poster: 'mr3h0pdd-image.png' },
      { title: 'The Batman', year: 2022, director: 'Matt Reeves', genre: 'Action, Crime', poster: 'mr39l9ij-image.png' },

      { title: 'The Irishman', year: 2019, director: 'Martin Scorsese', genre: 'Crime, Drama', poster: 'mr2fxjca-image.png' },
    ];

    function switchMode(mode) {
      sessionMode = mode;
      document.querySelectorAll('.mode-option').forEach(o => {
        o.classList.toggle('active', o.dataset.mode === mode);
      });
      const deadlineGroup = document.getElementById('nominationDeadlineGroup');
      const searchWrap = document.getElementById('movieSearchWrap');
      if (mode === 'normal') {
        deadlineGroup.style.display = '';
        deadlineGroup.classList.remove('mode-fields-reveal');
        void deadlineGroup.offsetWidth;
        deadlineGroup.classList.add('mode-fields-reveal');
        searchWrap.style.display = 'none';
        selectedMovie = null;
        document.getElementById('selectedMovieCard').style.display = 'none';
      } else {
        deadlineGroup.style.display = 'none';
        searchWrap.style.display = '';
        searchWrap.classList.remove('mode-fields-reveal');
        void searchWrap.offsetWidth;
        searchWrap.classList.add('mode-fields-reveal');
      }
    }

    function searchMovies() {
      const q = document.getElementById('movieSearch').value.trim().toLowerCase();
      const container = document.getElementById('movieSearchResults');
      if (!q || q.length < 2) { container.classList.remove('show'); return; }
      const results = filmDB.filter(f =>
        f.title.toLowerCase().includes(q) ||
        f.director.toLowerCase().includes(q) ||
        f.year.toString().includes(q)
      ).slice(0, 6);
      container.innerHTML = results.map(f => `
        <div class="movie-search-result" onclick="selectMovie('${f.title}')">
          <div class="sr-poster"><img src="${f.poster}" alt="${f.title}" /></div>
          <div class="sr-info"><div class="sr-title">${f.title}</div><div class="sr-meta">${f.year} · ${f.director}</div></div>
        </div>
      `).join('');
      container.classList.toggle('show', results.length > 0);
    }

    function selectMovie(title) {
      const film = filmDB.find(f => f.title === title);
      if (!film) return;
      selectedMovie = film;
      document.getElementById('movieSearch').value = film.title;
      document.getElementById('movieSearchResults').classList.remove('show');
      const card = document.getElementById('selectedMovieCard');
      card.innerHTML = `
        <div class="sm-poster"><img src="${film.poster}" alt="${film.title}" /></div>
        <div class="sm-info"><div class="sm-title">${film.title}</div><div class="sm-meta">${film.year} · ${film.director} · ${film.genre}</div></div>
        <button class="sm-remove" onclick="removeMovie()">&#x2715;</button>
      `;
      card.style.display = 'flex';
    }

    function removeMovie() {
      selectedMovie = null;
      document.getElementById('movieSearch').value = '';
      document.getElementById('selectedMovieCard').style.display = 'none';
    }

    function handleCreate() {
      const date = document.getElementById('sessionDate').value;
      const location = document.getElementById('sessionLocation').value.trim();
      if (!date || !location) {
        if (!date) document.getElementById('sessionDate').style.borderColor = 'var(--warn)';
        if (!location) document.getElementById('sessionLocation').style.borderColor = 'var(--warn)';
        return;
      }
      if (sessionMode === 'preselected' && !selectedMovie) {
        document.getElementById('movieSearch').style.borderColor = 'var(--warn)';
        return;
      }
      const btn = document.getElementById('createBtn');
      const invite = document.getElementById('inviteArea');
      btn.style.display = 'none';
      invite.classList.add('show');
    }

    function copyInvite() {
      const input = document.getElementById('inviteLink');
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    }
  </script>

</body>
</html>
