packages:
    - apps/*
    - packages/*

autoInstallPeers: false

engineStrict: true

linkWorkspacePackages: false

preferWorkspacePackages: false

saveExact: true

strictPeerDependencies: true

# Versions shared by several packages; better-auth's client and server must match.
catalog:
    '@types/node': 22.20.1
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.7
    better-auth: 1.7.5
    tsx: 4.23.13
    typescript: 6.0.3
    zod: 4.6.6

allowBuilds:
    '@parcel/watcher': false
    '@prisma/engines': true
    esbuild: true
    prisma: true

minimumReleaseAgeExclude:
    - '@aws-sdk/client-s3@3.1140.0'
    - nestjs-pino@5.2.1
    - resend@6.29.0

# Security fixes for transitive dependencies; remove once their parents depend on fixed versions.
overrides:
    deepmerge-ts@<8: 8.0.2
    mysql2@<3.23.1: 3.24.4
    # Nest pins Multer; remove once its Express adapter includes GHSA-q7qp-rjg7-q26m's fix.
    '@nestjs/platform-express@12.1.0>multer': 2.5.0
