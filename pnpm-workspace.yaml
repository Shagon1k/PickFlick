packages:
    - apps/*
    - packages/*

autoInstallPeers: false

engineStrict: true

linkWorkspacePackages: false

preferWorkspacePackages: false

saveExact: true

strictPeerDependencies: true

catalog:
    '@types/node': 22.20.1
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.7
    tsx: 4.23.13
    typescript: 6.0.3

allowBuilds:
    '@parcel/watcher': false
    '@prisma/engines': true
    esbuild: true
    prisma: true

minimumReleaseAgeExclude:
    - '@aws-sdk/client-s3@3.1140.0'
    - nestjs-pino@5.2.1
    - resend@6.29.0
