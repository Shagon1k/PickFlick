name: Deploy to UAT

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  uat-e2e:
    name: UAT E2E
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      UAT_URL: https://uat.pick-flick.app
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
      DOKPLOY_UAT_COMPOSE_ID: ${{ vars.DOKPLOY_UAT_COMPOSE_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0

      # A newer successful CI run owns UAT once main moves on.
      - name: Confirm main has not advanced
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${SOURCE_REVISION}"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Deploy the UAT Compose resource
        run: |
          set -euo pipefail

          dokploy() {
              curl --fail-with-body --silent --show-error \
                  --header "x-api-key: ${DOKPLOY_API_TOKEN}" \
                  --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
                  --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
                  "$@"
          }
          compose() {
              dokploy --get "${DOKPLOY_URL}/api/compose.one" \
                  --data-urlencode "composeId=${DOKPLOY_UAT_COMPOSE_ID}"
          }

          # The resource must build this repository's main branch from compose.deploy.yaml,
          # and only this workflow may start its deployments.
          before="$(compose)"
          jq -e '
              .sourceType == "github" and .owner == "Shagon1k" and .repository == "PickFlick"
              and .branch == "main" and .autoDeploy == false
              and .composeType == "docker-compose"
              and (.composePath | ltrimstr("./")) == "compose.deploy.yaml"
              and .composeStatus != "running"
          ' <<<"${before}" >/dev/null || {
              echo 'The Dokploy UAT resource does not match the UAT contract or is busy.' >&2
              exit 1
          }

          dokploy --request POST "${DOKPLOY_URL}/api/compose.deploy" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg composeId "${DOKPLOY_UAT_COMPOSE_ID}" \
                  --arg title "PickFlick UAT ${SOURCE_REVISION:0:12}" \
                  '{composeId: $composeId, title: $title}')" >/dev/null

          started=false
          for attempt in $(seq 1 180); do
              sleep 5
              status="$(compose | jq -r '.composeStatus // empty')"
              echo "Dokploy Compose status: ${status}"
              case "${status}" in
                  running) started=true ;;
                  done) [ "${started}" = true ] && exit 0 ;;
                  idle) ;;
                  error) echo 'Dokploy reported a failed deployment.' >&2; exit 1 ;;
                  *) echo "Unexpected Dokploy Compose status: ${status}" >&2; exit 1 ;;
              esac
          done
          echo 'Timed out waiting for Dokploy to finish the deployment.' >&2
          exit 1

      - name: Wait for the deployed revision to report ready
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
              live="$(curl --silent --fail "${UAT_URL}/api/health/live" || true)"
              ready="$(curl --silent --fail "${UAT_URL}/api/health/ready" || true)"
              if jq -e --arg revision "${SOURCE_REVISION}" \
                      '.status == "alive" and .revision == $revision' <<<"${live:-null}" >/dev/null \
                  && jq -e '.status == "ready" and all(.checks[]; .status == "up")' \
                      <<<"${ready:-null}" >/dev/null; then
                  echo "UAT serves ${SOURCE_REVISION} with every dependency up."
                  exit 0
              fi
              sleep 10
          done
          echo 'UAT did not report the deployed revision as ready within 20 minutes.' >&2
          exit 1

      - name: Run desktop and mobile browser smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.UAT_URL }}
        run: pnpm uat:smoke

      - name: Upload UAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-${{ env.SOURCE_REVISION }}
          path: test-results/uat/
          if-no-files-found: warn
          retention-days: 14
