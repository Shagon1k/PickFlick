name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  quality:
    name: Reproducible quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      COMPOSE_PROJECT_NAME: pickflick-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://pickflick_ci:synthetic-ci-password@127.0.0.1:5432/pickflick_test
      MINIO_ROOT_PASSWORD: synthetic-ci-password
      MINIO_ROOT_USER: pickflick-ci
      PICKFLICK_ENV_FILE: .env.example
      POSTGRES_DB: pickflick_test
      POSTGRES_PASSWORD: synthetic-ci-password
      POSTGRES_USER: pickflick_ci
      S3_ACCESS_KEY_ID: pickflick-ci
      S3_BUCKET: pickflick-ci-${{ github.run_id }}
      S3_SECRET_ACCESS_KEY: synthetic-ci-password

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject generated-artifact drift
        shell: bash
        run: |
          git diff --quiet
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build workspaces
        run: pnpm build

      - name: Validate deployment definitions
        run: pnpm compose:check

      - name: Start isolated test dependencies
        run: |
          docker compose --env-file .env.example -f compose.local.yaml up -d --wait postgres redis minio mailpit
          docker compose --env-file .env.example -f compose.local.yaml run --rm minio-init

      - name: Check dependency integration
        run: pnpm services:check

      - name: Apply migrations
        run: pnpm migrate

      - name: Load deterministic synthetic fixtures
        run: pnpm seed

      - name: Check migrations and database constraints
        run: pnpm db:check

      - name: Run built-runtime E2E smoke
        run: pnpm e2e:smoke

      - name: Stop isolated test dependencies
        if: ${{ always() }}
        run: docker compose --env-file .env.example -f compose.local.yaml down --volumes

      - name: Reject build-artifact drift
        if: ${{ success() }}
        shell: bash
        run: |
          git diff --quiet
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build production image targets
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: pnpm images:build

  delivery-gate:
    name: Delivery gate
    if: ${{ always() }}
    needs: [secret-scan, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        shell: bash
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
