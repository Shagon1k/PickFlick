name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  static:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build workspaces
        run: pnpm build

      - name: Reject build-artifact drift
        shell: bash
        run: |
          git diff --quiet
          test -z "$(git status --porcelain --untracked-files=all)"

  integration:
    name: Integration and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      RESEND_DELIVERY_MODE: disabled
      CI_COMPOSE_PROJECT_NAME: pickflick-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://pickflick_ci:synthetic-ci-password@127.0.0.1:5432/pickflick_test
      MINIO_ROOT_PASSWORD: synthetic-ci-password
      MINIO_ROOT_USER: pickflick-ci
      PICKFLICK_ENV_FILE: .env.example
      POSTGRES_DB: pickflick_test
      POSTGRES_PASSWORD: synthetic-ci-password
      POSTGRES_USER: pickflick_ci
      STORAGE_ACCESS_KEY: pickflick-ci
      STORAGE_BUCKET: pickflick-ci-${{ github.run_id }}
      STORAGE_SECRET_KEY: synthetic-ci-password

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm build

      - name: Validate deployment definitions
        run: pnpm compose:check

      - name: Start isolated test dependencies
        run: |
          docker compose --project-name "$CI_COMPOSE_PROJECT_NAME" --env-file .env.example -f compose.local.yaml up -d --wait postgres redis minio
          docker compose --project-name "$CI_COMPOSE_PROJECT_NAME" --env-file .env.example -f compose.local.yaml run --rm minio-init

      - name: Check dependency integration
        run: pnpm services:check

      - name: Apply migrations
        run: pnpm migrate

      - name: Load deterministic synthetic fixtures
        run: pnpm seed

      - name: Check migrations and database constraints
        run: pnpm db:check

      - name: Check Contact persistence and abuse controls
        run: pnpm contact:check

      - name: Run built-runtime E2E smoke
        run: pnpm e2e:smoke

      - name: Stop isolated test dependencies
        if: ${{ always() }}
        run: docker compose --project-name "$CI_COMPOSE_PROJECT_NAME" --env-file .env.example -f compose.local.yaml down --volumes

  ui-quality:
    name: UI accessibility and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UI accessibility, interaction, viewport, and visual checks
        run: pnpm ui:test

      - name: Upload UI failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: ui-quality-${{ github.sha }}
          path: test-results/
          retention-days: 14

  images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Build production image targets
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: pnpm images:build

  delivery-gate:
    name: Delivery gate
    if: ${{ always() }}
    needs: [secret-scan, static, integration, images, ui-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality job
        env:
          IMAGES_RESULT: ${{ needs.images.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UI_QUALITY_RESULT: ${{ needs.ui-quality.result }}
        shell: bash
        run: |
          test "$IMAGES_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$STATIC_RESULT" = "success"
          test "$UI_QUALITY_RESULT" = "success"
