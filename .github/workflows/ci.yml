name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject dependencies with known high or critical vulnerabilities
        run: pnpm security:audit

  static:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Reject unused files, exports, and dependencies
        run: pnpm knip

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build workspaces
        run: pnpm build

      - name: Reject build-artifact drift
        shell: bash
        run: |
          git diff --quiet
          test -z "$(git status --porcelain --untracked-files=all)"

  integration:
    name: Integration and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      AUTH_BASE_URL: http://127.0.0.1:3000
      AUTH_SECRET: synthetic-ci-auth-secret-at-least-32-characters
      GOOGLE_CLIENT_ID: synthetic-ci-google-client-id
      GOOGLE_CLIENT_SECRET: synthetic-ci-google-client-secret
      RESEND_DELIVERY_MODE: disabled
      CI_COMPOSE_PROJECT_NAME: pickflick-ci-${{ github.run_id }}-${{ github.run_attempt }}
      REDIS_URL: redis://127.0.0.1:16379
      DATABASE_URL: postgresql://pickflick_ci:synthetic-ci-password@127.0.0.1:15432/pickflick_test
      MINIO_ROOT_PASSWORD: synthetic-ci-password
      MINIO_ROOT_USER: pickflick-ci
      PICKFLICK_ENV_FILE: .env.example
      POSTGRES_DB: pickflick_test
      POSTGRES_PASSWORD: synthetic-ci-password
      POSTGRES_USER: pickflick_ci
      STORAGE_ACCESS_KEY: pickflick-ci
      STORAGE_BUCKET: pickflick-ci-${{ github.run_id }}
      STORAGE_SECRET_KEY: synthetic-ci-password

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm build

      - name: Validate deployment definitions
        run: pnpm deploy:check

      - name: Start isolated test dependencies
        run: |
          docker compose --project-name "$CI_COMPOSE_PROJECT_NAME" --env-file .env.example -f compose.local.yaml -f compose.ci.yaml up -d --wait postgres redis minio
          docker compose --project-name "$CI_COMPOSE_PROJECT_NAME" --env-file .env.example -f compose.local.yaml -f compose.ci.yaml run --rm minio-init

      - name: Check dependency integration
        run: pnpm services:check

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Load deterministic synthetic fixtures
        run: pnpm db:seed

      - name: Run database integration tests
        run: pnpm test:integration

      - name: Run built deadline worker recovery smoke
        run: pnpm test:worker

      - name: Run built-runtime E2E smoke
        run: pnpm test:e2e

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser journeys against the real API
        run: pnpm test:journeys

      - name: Upload journey failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: journeys-${{ github.sha }}
          path: test-results/
          retention-days: 14

      - name: Stop isolated test dependencies
        if: ${{ always() }}
        run: docker compose --project-name "$CI_COMPOSE_PROJECT_NAME" --env-file .env.example -f compose.local.yaml -f compose.ci.yaml down --volumes

  ui:
    name: UI ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # PRs select affected areas; main and manual runs use the full contract and visuals.
        suite: ${{ github.event_name == 'pull_request' && fromJSON('["smoke", "visual"]') || fromJSON('["contract", "visual"]') }}

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the selected UI ${{ matrix.suite }} checks
        env:
          UI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: node scripts/run-ui-checks.mjs "${{ matrix.suite }}" "$UI_BASE_SHA"

      - name: Upload UI failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: ui-${{ matrix.suite }}-${{ github.sha }}
          path: test-results/
          retention-days: 14

  images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Build production image targets
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: pnpm build:images

  delivery-gate:
    name: Delivery gate
    if: ${{ always() }}
    needs: [secret-scan, dependency-security, static, integration, images, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every quality job
        env:
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UI_RESULT: ${{ needs.ui.result }}
        shell: bash
        run: |
          test "$DEPENDENCY_SECURITY_RESULT" = "success"
          test "$IMAGES_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$STATIC_RESULT" = "success"
          test "$UI_RESULT" = "success"
