name: Technical debt
description: Track a known maintainability, reliability, or operational cost.
title: "[Tech debt]: "
body:
  - type: textarea
    id: context
    attributes:
      label: Context and current cost
      description: What is the debt, where is it, and what pain or risk does it create today?
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: What should be simpler, safer, or more reliable after this work?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that prove the debt is paid down.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
