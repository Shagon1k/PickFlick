name: Feature
description: Propose a user-facing capability or meaningful product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome, not a prescribed implementation. Keep the issue small enough
        to close with one focused pull request when possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should change, and why does it matter?
      placeholder: As a ..., I want ..., so that ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that prove this is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
